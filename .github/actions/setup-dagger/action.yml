name: 'Setup Dagger'
description: 'Restore the Dagger SDK and module cache shared by the bundle workflows.'

runs:
  using: 'composite'
  steps:
    - name: 'Cache Dagger'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.config/dagger
          ~/.cache/dagger
        key: ${{ runner.os }}-dagger-${{ hashFiles('dagger.json', '.dagger/src/**') }}
        restore-keys: |
          ${{ runner.os }}-dagger-
