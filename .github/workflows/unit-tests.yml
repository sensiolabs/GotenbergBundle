name: 'Unit Tests'

on:
  push:
    branches: ['main', '1.x']
  pull_request:
    branches: ['main', '1.x']
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: 'read'

jobs:

  test:
    name: 'Build and Test - PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony-version }}'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        symfony-version:
          - '6.4.*'
          - '7.2.*'
          - '7.3.*'
          - '7.4.x-dev'
        php:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5-rc'
        include:
          - symfony-version: '6.4.*'
            php: '8.1'
          - symfony-version: '8.0.x-dev'
            php: '8.4'
          - symfony-version: '8.0.x-dev'
            php: '8.5-rc'
    steps:
      - uses: 'actions/checkout@v4'

      - name: 'Cache Dagger'
        uses: 'actions/cache@v4'
        with:
          path: |
            ~/.config/dagger
            ~/.cache/dagger
          key: ${{ runner.os }}-dagger-${{ hashFiles('dagger.json', '.dagger/src/**') }}
          restore-keys: |
            ${{ runner.os }}-dagger-

      - name: 'Run test suite'
        uses: 'dagger/dagger-for-github@8.0.0'
        with:
          version: "latest"
          args: "test --symfony-version '${{ matrix.symfony-version }}' --php-version '${{ matrix.php }}' phpunit stdout"
        env:
          DAGGER_NO_NAG: '1'

  composer:
    name: 'Validate composer files and dependencies'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v4'

      - name: 'Cache Dagger'
        uses: 'actions/cache@v4'
        with:
          path: |
            ~/.config/dagger
            ~/.cache/dagger
          key: ${{ runner.os }}-dagger-${{ hashFiles('dagger.json', '.dagger/src/**') }}
          restore-keys: |
            ${{ runner.os }}-dagger-

      - name: 'Validate dependencies'
        uses: 'dagger/dagger-for-github@8.0.0'
        with:
          version: "latest"
          args: "test --symfony-version '^7.0' --php-version '8' validate-dependencies stdout"
        env:
          DAGGER_NO_NAG: '1'
