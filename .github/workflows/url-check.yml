name: 'URL check'

on:
  schedule:
    - cron: '0 1 1 * *'

jobs:

  check:
    name: 'URLs doc'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v4'

      - name: 'Setup PHP'
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '8.3'
          coverage: 'none'

      - name: 'Install dependencies'
        uses: 'ramsey/composer-install@v3'

      - name: 'Check links into PhpDoc'
        run: 'php ./docs/CheckPhpDoc.php'
