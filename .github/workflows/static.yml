name: 'Static analysis'

on:
  push:
    branches: ['main', '1.x']
  pull_request:
    branches: ['main', '1.x']

permissions:
  contents: 'read'

jobs:

  php-cs-fixer:
    name: 'PHP CS Fixer'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v4'

      - name: 'Cache Dagger'
        uses: 'actions/cache@v4'
        with:
          path: |
            ~/.config/dagger
            ~/.cache/dagger
          key: ${{ runner.os }}-dagger-${{ hashFiles('dagger.json', '.dagger/src/**') }}
          restore-keys: |
            ${{ runner.os }}-dagger-

      - name: 'Run test suite'
        uses: 'dagger/dagger-for-github@8.0.0'
        with:
          version: "latest"
          args: "test php-cs-fixer stdout"
        env:
          DAGGER_NO_NAG: '1'

  phpstan:
    name: 'PHPStan - PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony-version }}'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        symfony-version:
          - '6.4.*'
          - '7.2.*'
          - '7.3.*'
        php:
          - '8.2'
          - '8.3'
          - '8.4'
    steps:
      - uses: 'actions/checkout@v4'

      - name: 'Cache Dagger'
        uses: 'actions/cache@v4'
        with:
          path: |
            ~/.config/dagger
            ~/.cache/dagger
          key: ${{ runner.os }}-dagger-${{ hashFiles('dagger.json', '.dagger/src/**') }}
          restore-keys: |
            ${{ runner.os }}-dagger-

      - name: 'Run test suite'
        uses: 'dagger/dagger-for-github@8.0.0'
        with:
          version: "latest"
          args: "test --symfony-version '${{ matrix.symfony-version }}' --php-version '${{ matrix.php }}' phpstan stdout"
        env:
          DAGGER_NO_NAG: '1'
