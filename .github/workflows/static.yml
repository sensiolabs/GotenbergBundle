name: 'Static analysis'

on:
  push:
    branches: ['main', '1.x']
  pull_request:
    branches: ['main', '1.x']

permissions:
  contents: 'read'

jobs:
  php-cs-fixer:
    name: 'PHP CS Fixer'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v4'

      - name: 'Cache Dagger'
        uses: 'actions/cache@v4'
        with:
          path: |
            ~/.config/dagger
            ~/.cache/dagger
          key: ${{ runner.os }}-dagger-${{ hashFiles('dagger.json', '.dagger/src/**') }}
          restore-keys: |
            ${{ runner.os }}-dagger-

      - name: 'Run test suite'
        uses: 'dagger/dagger-for-github@8.0.0'
        with:
          version: 'latest'
          call: 'test php-cs-fixer'
          dagger-flags: '--silent'
        env:
          DAGGER_NO_NAG: '1'

  phpstan:
    name: 'PHPStan'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v4'

      - name: 'Cache Dagger'
        uses: 'actions/cache@v4'
        with:
          path: |
            ~/.config/dagger
            ~/.cache/dagger
          key: ${{ runner.os }}-dagger-${{ hashFiles('dagger.json', '.dagger/src/**') }}
          restore-keys: |
            ${{ runner.os }}-dagger-

      - name: 'Run test suite'
        uses: 'dagger/dagger-for-github@8.0.0'
        with:
          version: 'latest'
          call: 'test phpstan'
          dagger-flags: '--silent'
        env:
          DAGGER_NO_NAG: '1'
