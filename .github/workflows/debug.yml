name: 'Debug'

on:
  push:
  pull_request:
    types:
      - 'opened'
      - 'synchronize'
      - 'reopened'
      - 'ready_for_review'
  workflow_dispatch:

permissions:
  contents: 'read'
  pull-requests: 'write'

jobs:
  test:
    runs-on: "ubuntu-latest"
    steps:
      - uses: 'actions/checkout@v4'
      - name: 'Show fix'
        run: 'head -n20 src/DependencyInjection/CompilerPass/GotenbergPass.php'
      - name: "Run tests"
        id: 'test'
        uses: 'dagger/dagger-for-github@8.0.0'
        with:
          version: 'latest'
          call: 'test --symfony-version="7.4.x-dev" --php-version="8.3" phpunit --filter="testBundleDefault"'
          dagger-flags: '--quiet'
          cloud-token: '${{ secrets.DAGGER_CLOUD_TOKEN }}'
      - name: "Check traceURL output"
        run: 'echo "Trace URL: ${{ steps.test.outputs.traceURL }}"'
        if: 'always()'
